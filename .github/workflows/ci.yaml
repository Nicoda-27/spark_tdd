name: Continuous Integration
run-name: Continuous Integration
on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.devcontainer_tag.outputs.tag }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Compute devcontainer image tag
        id: devcontainer_tag
        run: |
          TAG="devcontainer-${{ hashFiles('.devcontainer/**') }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "DEVCONTAINER_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull devcontainer image if already published
        id: pull
        continue-on-error: true
        env:
          REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: docker pull "${REPO}:${DEVCONTAINER_TAG}"

      - name: Set up Docker Buildx
        if: steps.pull.outcome != 'success'
        uses: docker/setup-buildx-action@v3

      - name: Build and push devcontainer image
        if: steps.pull.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          target: devcontainer
          push: true
          tags: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ env.DEVCONTAINER_TAG }}

  Formatting:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    container:
      image: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ needs.build-and-push.outputs.tag }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Run formatting
        run: uv run ruff check

      - name: Minimize uv cache
        run: uv cache prune --ci

  Tests:
    runs-on: ubuntu-latest
    needs: [build-and-push,Formatting]
    container:
      image: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ needs.build-and-push.outputs.tag }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Run tests
        run: uv run pytest

      - name: Minimize uv cache
        run: uv cache prune --ci
